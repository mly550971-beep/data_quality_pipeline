rules:
  global:
    max_missing_rate: 0.20
    max_duplicate_rate: 0.05
  columns:
    email:
      type: regex
      pattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
    amount:
      type: range
      min: 0
      max: 100000
    customer_id:
      type: not_null
    order_id:
      type: unique
    date:
      type: date
    order_date:
      type: date
